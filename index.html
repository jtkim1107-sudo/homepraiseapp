<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리집 칭찬가게</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: linear-gradient(160deg, #343A55 0%, #4A3F7A 100%);
      color: #fff;
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 340px; }
    .emoji { font-size: 72px; margin-bottom: 18px; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { font-size: 15px; line-height: 1.7; color: rgba(255,255,255,0.85); margin: 0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="emoji">🍪</div>
    <h1>우리집 칭찬가게는<br>문을 닫았어요</h1>
    <p>그동안 함께해주셔서 감사합니다.<br>
    아이들의 약속과 칭찬이<br>
    좋은 추억으로 남았기를 바라요. 💛</p>
  </div>
</body>
</html>
